<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Engineering Drawings</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --white: #ffffff;
        --off-white: #f5f5f5;
        --light-grey: #e8e8e8;
        --mid-grey: #9a9a9a;
        --blank: #f0f3f6;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Barlow', Helvetica Neue, Helvetica, Arial, sans-serif;
        margin: 0; background: #eaeaea; color: var(--navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }
    .viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .stage {
        width: 1280px; height: 720px; background: var(--white); border-top: 6px solid var(--navy);
        position: relative; padding: 0; transform-origin: center center; flex-shrink: 0; overflow: hidden;
    }
    .ui-zoomer { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; padding: 36px 64px 0 64px; transform-origin: 0 0; }
    .ui-spot { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease); }
    .ui-spot.on { opacity: 1; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; color: var(--mid-grey); }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption {
        position: absolute; left: 64px; right: 64px; bottom: 30px;
        font-size: 27px; font-weight: 500; line-height: 1.35;
        display: flex; align-items: center; gap: 16px; min-height: 60px;
    }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption b { font-weight: 800; color: var(--pink); }
    .caption.in { animation: capIn .45s var(--ease); }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; }

    .hide { opacity: 0; transform: translateY(14px); }
    .rev { transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .35s, color .35s, border-color .35s; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .hint { margin-top: 22px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }

    /* layout */
    .split { display: flex; align-items: center; justify-content: space-between; height: 100%; gap: 32px; }
    .cfu { display: flex; flex-direction: column; height: 100%; }
    .cfu > .dwg { margin: 0 auto; }
    .qrow { display: flex; justify-content: space-between; align-items: center; gap: 30px; margin-bottom: 14px; min-height: 52px; }
    .q { font-size: 31px; font-weight: 700; line-height: 1.2; }
    .q b { color: var(--pink); font-weight: 800; }
    .etag { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 20px; border-radius: 25px; color: var(--white); flex-shrink: 0;
        font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
    .etag.pk { background: var(--pink); }
    .etag.nv { background: var(--navy); }
    .etag svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .etag .ui-ar { opacity: .75; width: 20px; }

    /* options */
    .opts { display: flex; gap: 16px; }
    .optv { display: flex; flex-direction: column; gap: 14px; }
    .opt { flex: 1; display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; padding: 10px 18px; font-size: 25px; font-weight: 600; line-height: 1.25; }
    .olt { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: var(--white); flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 900; transition: background-color .35s, color .35s; }
    .opt.right { background: var(--pink); border-color: var(--pink); color: var(--white); }
    .opt.right .olt { background: var(--white); color: var(--pink); }
    .opt.dimd { opacity: .3; }
    .ogrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 18px; }
    .opan { border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; }
    .oph { display: flex; align-items: center; gap: 12px; padding: 5px 14px; border-bottom: 3px solid var(--navy); font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; transition: background-color .35s, color .35s, border-color .35s; }
    .oph .olt { width: 28px; height: 28px; font-size: 18px; }
    .oph .why { margin-left: auto; color: var(--pink); letter-spacing: 0.06em; opacity: 0; transition: opacity .4s; }
    .opan.shw .why { opacity: 1; }
    .opan svg { margin: 0 auto; transition: opacity .4s; }
    .opan.right { border-color: var(--pink); }
    .opan.right .oph { background: var(--pink); border-color: var(--pink); color: var(--white); }
    .opan.right .oph .olt { background: var(--white); color: var(--pink); }
    .opan.right .why { color: var(--white); }
    .opan.dimd { border-color: #c9ccd6; }
    .opan.dimd .oph { border-color: #c9ccd6; color: var(--mid-grey); }
    .opan.dimd .oph .olt { background: #c9ccd6; }
    .opan.dimd svg { opacity: .3; }

    /* legend and notes */
    .legend { width: 470px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; }
    .lrow { display: flex; gap: 16px; align-items: flex-start; font-size: 24px; font-weight: 500; line-height: 1.3; }
    .lrow b { font-weight: 800; }
    .lrow .n { width: 34px; height: 34px; border-radius: 50%; background: var(--pink); color: var(--white); flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 900; }
    .lrow .sqb { width: 12px; height: 12px; background: var(--pink); margin: 10px 11px 0; flex-shrink: 0; }
    .lrow.mute { color: var(--mid-grey); }
    .nt { border-left: 6px solid var(--pink); padding: 6px 0 6px 20px; font-size: 25px; font-weight: 500; line-height: 1.3; }
    .nt b { font-weight: 800; color: var(--pink); }
    .chips { display: flex; gap: 16px; justify-content: center; margin-top: 26px; }
    .chip { border: 3px solid var(--navy); border-radius: 30px; padding: 8px 24px; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
    .chip b { color: var(--pink); font-weight: 900; }
    .unit { position: absolute; right: 0; top: 120px; width: 240px; border: 3px solid var(--pink); border-radius: 8px; padding: 16px 22px; }
    .unit .um { font-family: 'Barlow Condensed', sans-serif; font-size: 64px; font-weight: 900; color: var(--pink); line-height: 1; margin: 6px 0; }
    .unit .us { font-size: 21px; font-weight: 600; line-height: 1.3; }
    .rcol { display: flex; flex-direction: column; align-items: center; gap: 26px; width: 440px; flex-shrink: 0; }
    .symcard { display: flex; align-items: center; gap: 22px; border: 3px solid var(--pink); border-radius: 8px; padding: 14px 24px; width: 100%; }
    .symcard .big { font-family: 'Barlow Condensed', sans-serif; font-size: 96px; font-weight: 900; color: var(--pink); line-height: 1; width: 70px; text-align: center; flex-shrink: 0; }
    .symcard .tx { font-size: 23px; font-weight: 600; line-height: 1.3; }
    .symcard .dlbl { margin-bottom: 4px; }
    .symcard.nv { border-color: var(--navy); }
    .qcol { width: 430px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
    .qcol .optv { width: 100%; }
    .qnum { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }

    /* summary */
    .sumgrid { display: grid; grid-template-columns: repeat(2, 540px); gap: 26px 32px; }
    .dcard { border: 3px solid var(--navy); border-radius: 8px; padding: 22px 30px; }
    .dcard.pink { border-color: var(--pink); }
    .dex { font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 900; margin: 4px 0 6px 0; line-height: 1; }
    .dcard.pink .dex span { color: var(--pink); }
    .dhow { font-size: 24px; font-weight: 600; line-height: 1.3; }

    .dia { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-style: normal; font-weight: 700; }
    .dwg .dia { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .symcard .big .dia { font-weight: 700; }
    .symcard .big { width: auto; min-width: 84px; }
    /* engineering drawings */
    .dwg { display: block; overflow: visible; flex-shrink: 0; }
    .dwg text { font-family: 'Barlow', Helvetica Neue, Helvetica, Arial, sans-serif; }
    .dwg .o { fill: none; stroke: var(--navy); stroke-width: 4; stroke-linejoin: miter; stroke-linecap: butt; }
    .dwg .p { fill: none; stroke: var(--pink); stroke-width: 1.8; }
    .dwg .gh { fill: none; stroke: #b4b8c6; stroke-width: 1.8; }
    .dwg .cl { fill: none; stroke: var(--navy); stroke-width: 1.5; }
    .dwg .hid { fill: none; stroke: var(--navy); stroke-width: 2; stroke-dasharray: 8 5; }
    .dwg .gd { fill: none; stroke: #bfc3cf; stroke-width: 1.5; stroke-dasharray: 5 6; }
    .dwg .ah { fill: var(--pink); }
    .dwg .ah.g { fill: #b4b8c6; }
    .dwg .dv { fill: var(--pink); font-size: 23px; font-weight: 700; }
    .dwg .dv.g { fill: var(--mid-grey); }
    .dwg .pkl { fill: none; stroke: var(--pink); stroke-width: 5; }
    .dwg .vlab { fill: var(--navy); font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; }
    .dwg .note { fill: var(--navy); font-size: 24px; font-weight: 800; }
    .dwg .ring { fill: none; stroke: var(--pink); stroke-width: 2.5; stroke-dasharray: 4 4; }
    .dwg .f3 { stroke: var(--navy); stroke-width: 3; stroke-linejoin: round; }
    .dwg .h3 { fill: #d5d9e3; stroke: var(--navy); stroke-width: 2.5; stroke-linejoin: round; }
    .dwg .dot { fill: var(--navy); stroke: #fff; stroke-width: 2; }
    .dwg .dot.pk { fill: var(--pink); }
    .dwg .cdot { fill: var(--pink); }
    .dwg .sw { fill: none; stroke: var(--pink); stroke-width: 3; opacity: 0; transition: transform 2.4s var(--ease), opacity .4s; }
    .dwg .sw.on { opacity: 1; }
    .dwg .sw.spin { transform: rotate(-225deg); }
    .dwg .sw.gone { opacity: 0; }
    .dwg .arm { opacity: 0; transition: transform 2s linear, opacity .4s; }
    .dwg .arm.on { opacity: 1; }
    .dwg .arm.r360 { transform: rotate(360deg); }
    .dwg .arm.gone { opacity: 0; }
    .dwg .arm2 { opacity: 0; transition: transform 1.3s var(--ease), opacity .4s; }
    .dwg .arm2.on { opacity: 1; }
    .dwg .arm2.s1 { transform: rotate(90deg); }
    .dwg .arm2.s2 { transform: rotate(45deg); }
    .dwg .arm2.gone { opacity: 0; }
    .dwg .armk { fill: none; stroke: var(--navy); stroke-width: 3; stroke-linecap: round; }
    .dwg .armp { fill: none; stroke: var(--pink); stroke-width: 3; stroke-linecap: round; }
    .dwg .armh { fill: var(--navy); }
    .dwg .armt { fill: var(--pink); }
    .dwg.sm .o { stroke-width: 3; }
    .dwg.sm .dv { font-size: 19px; }
    .dwg.sm .vlab { font-size: 14px; }

    /* drawing reveals */
    .dwg .dr { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .8s var(--ease), stroke .3s, stroke-width .3s; }
    .dwg .dr.on { stroke-dashoffset: 0; }
    .dwg .dr.slow { transition: stroke-dashoffset 1.6s var(--ease), stroke .3s, stroke-width .3s; }
    .dwg .dr.lin { transition: stroke-dashoffset 2s linear; }
    .dwg .fd, .dwg .fd2 { opacity: 0; transition: opacity .45s var(--ease), fill .3s, stroke .3s, stroke-width .3s; }
    .dwg .fd.on, .dwg .fd2.on { opacity: 1; }
    .dwg .gr { transform: scale(0); transform-box: fill-box; transform-origin: center; transition: transform .7s var(--ease), stroke .3s, stroke-width .3s; }
    .dwg .gr.on { transform: none; }
    .dwg.st .dr { stroke-dashoffset: 0; }
    .dwg.st .fd { opacity: 1; }
    .dwg.st .gr { transform: none; }
    .dwg .hot { animation: hotp .9s ease-in-out 2; }
    .dwg .o.hot, .dwg .cl.hot { stroke: var(--pink); }
    .dwg .p.hot, .dwg .cl.hot { stroke-width: 3; }
    .dwg .dv.hot { font-weight: 800; }
    @keyframes hotp { 50% { opacity: .3; } }

    /* markers */
    .dwg .lm circle { fill: var(--navy); transition: fill .3s; }
    .dwg .lm .lp { fill: none; stroke: var(--navy); stroke-width: 1.6; transition: stroke .3s; }
    .dwg .lm .lt { fill: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 900; }
    .dwg .lm.pk circle { fill: var(--pink); }
    .dwg .lm.pk .lp { stroke: var(--pink); }
    .dwg .dimd { opacity: .22 !important; transition: opacity .4s; }
    .dwg .mlab { fill: var(--navy); font-size: 21px; font-weight: 700; }
    .dwg .mlab.pkt { fill: var(--pink); font-weight: 800; }

    /* controls */
    .controls { position: relative; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 24px; padding: 12px 20px 16px; width: 100%; font-family: 'Barlow Condensed', sans-serif; }
    .grp { display: flex; align-items: center; gap: 8px; }
    .controls [hidden] { display: none !important; }
    .controls button {
        font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2;
        display: inline-flex; align-items: center; gap: 8px; background: var(--white); color: var(--navy); border: none; border-radius: 6px; padding: 9px 13px; cursor: pointer;
    }
    .controls button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .controls button.on { background: var(--pink); color: var(--white); }
    .controls button.ui-pri { background: var(--navy); color: var(--white); }
    .controls button.ui-fs { background: var(--pink); color: var(--white); }
    .controls button.ui-fs.ui-isfs { background: var(--white); color: var(--navy); }
    .controls button.ui-fs.ui-nudge { animation: nudge 1.6s ease-out 1s 4; }
    @keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(234,0,138,.55); } 70%, 100% { box-shadow: 0 0 0 14px rgba(234,0,138,0); } }
    .controls svg.ui-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .controls svg.ui-chev { width: 13px; height: 13px; stroke-width: 3; opacity: .6; transition: transform .2s var(--ease); }
    .ui-menu.ui-open > .ui-mt svg.ui-chev { transform: rotate(180deg); }
    .ui-mt .ui-pdot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px var(--white); }
    .controls .dots { display: flex; gap: 8px; margin: 0 8px 0 12px; }
    .controls .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; background: #c9ccd6; }
    .controls .dots button.cur { background: var(--pink); }
    .steplbl { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); margin-left: 6px; min-width: 110px; }
    .controls kbd { margin-left: 2px; }

    /* menus */
    .ui-menu { position: relative; }
    .ui-pop { display: none; position: absolute; left: 0; bottom: calc(100% + 10px); min-width: 260px; flex-direction: column; gap: 2px; padding: 4px 8px 8px;
        background: var(--white); border-top: 6px solid var(--navy); border-radius: 10px; box-shadow: 0 10px 30px rgba(27,31,69,.25), 0 0 0 1px rgba(27,31,69,.08); }
    .ui-menu.ui-r .ui-pop { left: auto; right: 0; }
    .ui-menu.ui-open .ui-pop { display: flex; animation: popIn .18s var(--ease); }
    @keyframes popIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .ui-ph { font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); padding: 10px 10px 6px; }
    .ui-pop .ui-mi { width: 100%; padding: 9px 10px; background: transparent; white-space: nowrap; }
    .ui-pop .ui-mi:hover { background: var(--off-white); }
    .ui-pop .ui-mi kbd { margin-left: auto; padding-left: 5px; }
    .ui-pop .ui-mi .ui-ind { width: 14px; height: 14px; border: 2.5px solid var(--navy); border-radius: 3px; flex-shrink: 0; margin-right: 4px; }
    .ui-pop .ui-mi .ui-ind.ui-no { border-color: transparent; }
    .ui-pop .ui-mi.on { background: transparent; color: var(--pink); }
    .ui-pop .ui-mi.on:hover { background: var(--off-white); }
    .ui-pop .ui-mi.on .ui-ind { background: var(--pink); border-color: var(--pink); }
    .ui-pop .ui-mi:disabled { opacity: .35; cursor: default; background: transparent; }
    .ui-pop .ui-mi.ui-eng .ui-ind { border: none; border-radius: 50%; }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-pk { background: var(--pink); }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-nv { background: var(--navy); }
    .ui-pop .ui-swrow { display: flex; gap: 8px; padding: 4px 10px 10px 38px; }
    .ui-pop .swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 3px solid var(--white); box-shadow: 0 0 0 1px #c9ccd6; }
    .ui-pop .swatch.cur { box-shadow: 0 0 0 3px var(--navy); }
    .ui-pop .ui-div { height: 1.5px; background: var(--light-grey); margin: 4px 6px; }



    /* highlighter and whiteboard surfaces */
    .ui-hlc { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; z-index: 4; mix-blend-mode: multiply; }
    .ui-wboard { display: none; position: absolute; left: 0; top: 0; width: 1280px; height: 714px; background: var(--white); z-index: 3; }
    body.ui-wb .ui-wboard { display: block; }
    .ui-wbl { position: absolute; right: 64px; top: 40px; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); }
    .ui-wbl b { color: var(--navy); }
    .ui-wbg { display: none; }
    body.ui-wb .ui-wbg { display: flex; }
    body.ui-wb .grp.ui-nav { display: none; }
    .ui-wbtag { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); background: var(--pink); border-radius: 6px; padding: 9px 13px; line-height: 1.2; }
    .controls button:disabled { opacity: .35; cursor: default; }
    #ovbtn { padding: 9px 11px; }

    /* overlays */
    .ui-ovw[hidden], .ui-keys[hidden], .ui-blk[hidden] { display: none !important; }
    .ui-ovw { position: fixed; inset: 0; z-index: 45; background: rgba(27,31,69,.96); overflow-y: auto; padding: 40px 48px 60px; opacity: 0; transition: opacity .2s; }
    .ui-ovw.on, .ui-keys.on, .ui-blk.on { opacity: 1; }
    .ui-ovh { display: flex; justify-content: space-between; align-items: flex-end; max-width: 1296px; margin: 0 auto 28px; padding-bottom: 12px; border-bottom: 4px solid var(--white); color: var(--white); }
    .ui-ovh h2 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; line-height: 1; }
    .ui-ovh h2 span { color: var(--pink); }
    .ui-ovh .ui-hint, .ui-blk .ui-bh { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); }
    .ui-ovh kbd { display: inline-block; padding: 0 6px; border: 1.5px solid currentColor; border-radius: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 17px; }
    .ui-ovg { display: grid; grid-template-columns: repeat(auto-fill, 300px); gap: 30px 24px; justify-content: center; max-width: 1296px; margin: 0 auto; }
    .ui-ovc { background: none; border: none; padding: 0; margin: 0; cursor: pointer; text-align: left; color: var(--white); font-family: 'Barlow Condensed', sans-serif; }
    .ui-ovc:focus-visible { outline: none; }
    .ui-ovc .ui-thw { position: relative; width: 300px; height: 168.75px; overflow: hidden; border-radius: 6px; background: var(--white); transition: box-shadow .15s, transform .15s var(--ease); }

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), caption = $('#caption'), titleEl = $('#title'), counter = $('#counter'), progress = $('#progress');
let timers = [], events = [], beats = [], idx = 0, beat = 0, autoplay = false;
let segFrom = 0, segTo = 0, segStart = 0;
let ptimers = [], cleanups = [];
const stage = document.getElementById('stage');

function at(ms, fn) { events.push({ t: ms, fn, done: false }); }
function beatAt(ms, html) { beats.push(ms); at(ms, () => say(html)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function show(e) { e.classList.remove('hide'); }
function say(html) { caption.innerHTML = '<span>' + html + '</span>'; caption.classList.remove('in'); void caption.offsetWidth; caption.classList.add('in'); }
function stopInteractive() { ptimers.forEach(clearTimeout); ptimers = []; cleanups.forEach(f => f()); cleanups = []; }

/* ---------- drawing helpers ---------- */
const NS = 'http://www.w3.org/2000/svg', GAP = 6, EXT = 10, D2R = Math.PI / 180;
const r2 = v => Math.round(v * 100) / 100;
function S(tag, a, cls) { const e = document.createElementNS(NS, tag); if (a) for (const k in a) e.setAttribute(k, a[k]); if (cls) e.setAttribute('class', cls); return e; }
function svgc(w, h, cls) { return S('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h, 'aria-hidden': 'true' }, 'dwg' + (cls ? ' ' + cls : '')); }
function G(p, cls) { const e = S('g', null, cls); p.appendChild(e); return e; }
function P(p, d, cls) { const e = S('path', { d }, cls); if (!/\b(cl|hid|gd)\b/.test(cls)) e.setAttribute('pathLength', 1); p.appendChild(e); return e; }
function T(p, x, y, txt, cls, anchor, rot) {
    const e = S('text', { x: r2(x), y: r2(y), 'text-anchor': anchor || 'middle' }, cls);
    if (rot) e.setAttribute('transform', `rotate(${rot} ${r2(x)} ${r2(y)})`);
    if (txt.includes('<i')) e.innerHTML = txt.replace(/<i class="dia">Ø<\/i>/g, '<tspan class="dia">Ø</tspan>'); else e.textContent = txt; p.appendChild(e); return e;
}
function arrowD(x, y, dx, dy) { const L = 19, W = 4, bx = x - dx * L, by = y - dy * L, nx = -dy * W, ny = dx * W; return `M${r2(x)} ${r2(y)}L${r2(bx + nx)} ${r2(by + ny)}L${r2(bx - nx)} ${r2(by - ny)}Z`; }
function AH(p, x, y, dx, dy, g) { return P(p, arrowD(x, y, dx, dy), 'ah fd' + (g ? ' g' : '')); }
function circD(cx, cy, r) { return `M${cx} ${cy - r}A${r} ${r} 0 1 1 ${cx} ${cy + r}A${r} ${r} 0 1 1 ${cx} ${cy - r}`; }
/* plate outline, corner radii: top-left, top-right, bottom-right, bottom-left. Starts mid top edge so the draw-on closes cleanly. */
function plateD(x, y, w, h, a = 0, b = 0, c = 0, d = 0) {
    return `M${x + w / 2} ${y}H${x + w - b}` + (b ? `A${b} ${b} 0 0 1 ${x + w} ${y + b}` : '') + `V${y + h - c}` +
        (c ? `A${c} ${c} 0 0 1 ${x + w - c} ${y + h}` : '') + `H${x + d}` + (d ? `A${d} ${d} 0 0 1 ${x} ${y + h - d}` : '') +
        `V${y + a}` + (a ? `A${a} ${a} 0 0 1 ${x + a} ${y}` : '') + 'Z';
}
/* chain line (long dash, short dash) built symmetrically so the centre always falls on a long dash and each end finishes on a long dash */
function chainSegs(half) {
    if (half <= 21) return [[-half, half]];
    const c = 9, segs = [[-c, c]], k = Math.max(1, Math.round((half - c) / 34)), L = (half - c) / k - 9;
    let q = c;
    for (let i = 0; i < k; i++) { segs.push([q + 3, q + 6], [q + 9, q + 9 + L]); q += 9 + L; }
    return segs.flatMap(([a, b]) => a === -b ? [[a, b]] : [[a, b], [-b, -a]]);
}
function chainD(cx, cy, half, horiz) { return chainSegs(half).map(([a, b]) => horiz ? `M${r2(cx + a)} ${cy}H${r2(cx + b)}` : `M${cx} ${r2(cy + a)}V${r2(cy + b)}`).join(''); }
function cross(p, cx, cy, hx, hy, cls) { cls = cls || 'cl gr'; hy = hy || hx; return [P(p, chainD(cx, cy, hx, true), cls), P(p, chainD(cx, cy, hy, false), cls)]; }

/* linear dimensions: object points, dimension line position, value */
function dimH(p, x1, x2, ya, yb, yd, txt, o = {}) {
    const s = yd > ya ? 1 : -1, c = o.ghost ? 'gh' : 'p', gh = !!o.ghost;
    const e = [P(p, `M${x1} ${ya + s * GAP}V${yd + s * EXT}`, c + ' dr'), P(p, `M${x2} ${yb + s * GAP}V${yd + s * EXT}`, c + ' dr')];
    let l, a;
    if (o.out) {
        l = [P(p, `M${x1 - 34} ${yd}H${x1}`, c + ' dr'), P(p, `M${x2 + 34} ${yd}H${x2}`, c + ' dr')];
        a = [AH(p, x1, yd, 1, 0, gh), AH(p, x2, yd, -1, 0, gh)];
    } else {
        const m = (x1 + x2) / 2;
        l = [P(p, `M${m} ${yd}H${x1}`, c + ' dr'), P(p, `M${m} ${yd}H${x2}`, c + ' dr')];
        a = [AH(p, x1, yd, -1, 0, gh), AH(p, x2, yd, 1, 0, gh)];
    }
    const t = T(p, (x1 + x2) / 2, yd - 9, txt, 'dv fd' + (gh ? ' g' : ''));
    return { e, l, a, t, all: [...e, ...l, ...a, t] };
}
function dimV(p, y1, y2, xa, xb, xd, txt) {
    if (y1 > y2) { [y1, y2] = [y2, y1]; [xa, xb] = [xb, xa]; }
    const s = xd > xa ? 1 : -1, m = (y1 + y2) / 2;
    const e = [P(p, `M${xa + s * GAP} ${y1}H${xd + s * EXT}`, 'p dr'), P(p, `M${xb + s * GAP} ${y2}H${xd + s * EXT}`, 'p dr')];
    const l = [P(p, `M${xd} ${m}V${y1}`, 'p dr'), P(p, `M${xd} ${m}V${y2}`, 'p dr')];
    const a = [AH(p, xd, y1, 0, -1), AH(p, xd, y2, 0, 1)];
    const t = T(p, xd - 9, m, txt, 'dv fd', 'middle', -90);
    return { e, l, a, t, all: [...e, ...l, ...a, t] };
}
/* diameter: dimension line through the centre, arrowheads touching the circle, leader to a horizontal value */
function dimDia(p, cx, cy, r, ang, lead, txt) {
    const ux = Math.cos(ang * D2R), uy = Math.sin(ang * D2R), sx = ux >= 0 ? 1 : -1;
    const x1 = cx - ux * r, y1 = cy - uy * r, x2 = cx + ux * r, y2 = cy + uy * r, x3 = cx + ux * (r + lead), y3 = cy + uy * (r + lead);
    const l = [P(p, `M${r2(x1)} ${r2(y1)}L${r2(x3)} ${r2(y3)}`, 'p dr'), P(p, `M${r2(x3)} ${r2(y3)}H${r2(x3 + sx * 18)}`, 'p dr')];
    const a = [AH(p, x2, y2, ux, uy), AH(p, x1, y1, -ux, -uy)];
    const t = T(p, x3 + sx * 24, y3 + 8, txt, 'dv fd', sx > 0 ? 'start' : 'end');
    return { e: [], l, a, t, all: [...l, ...a, t] };
}
/* radius: leader in line with the arc centre, one arrowhead touching the arc from outside */
function dimRad(p, cx, cy, r, ang, lead, txt) {
    const ux = Math.cos(ang * D2R), uy = Math.sin(ang * D2R), sx = ux >= 0 ? 1 : -1;
    const x2 = cx + ux * r, y2 = cy + uy * r, x3 = cx + ux * (r + lead), y3 = cy + uy * (r + lead);
    const l = [P(p, `M${r2(x3)} ${r2(y3)}L${r2(x2)} ${r2(y2)}`, 'p dr'), P(p, `M${r2(x3)} ${r2(y3)}H${r2(x3 + sx * 18)}`, 'p dr')];
    const a = [AH(p, x2, y2, -ux, -uy)];
    const t = T(p, x3 + sx * 24, y3 + 8, txt, 'dv fd', sx > 0 ? 'start' : 'end');
    return { e: [], l, a, t, all: [...l, ...a, t] };
}
function marker(p, x, y, tx, ty, txt, cls) {
    const g = G(p, 'lm fd' + (cls ? ' ' + cls : ''));
    if (tx !== undefined && tx !== null) { const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy); P(g, `M${r2(x + dx / d * 17)} ${r2(y + dy / d * 17)}L${tx} ${ty}`, 'lp'); }
    g.appendChild(S('circle', { cx: x, cy: y, r: 17 }));
    T(g, x, y + 7.5, txt, 'lt');
    return g;
}
const on = l => [].concat(l).forEach(e => e && e.classList.add('on'));
const off = l => [].concat(l).forEach(e => e && e.classList.remove('on'));
const rv = (t, ...l) => at(t, () => on(l.flat()));
function hot(l) { content.querySelectorAll('.hot').forEach(e => e.classList.remove('hot')); [].concat(l).forEach(e => e && e.classList.add('hot')); }
function rd(d, t) { rv(t, d.e); rv(t + 300, d.l); rv(t + 750, d.a); rv(t + 900, d.t); }
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tweener() {
    let raf = 0; cleanups.push(() => cancelAnimationFrame(raf));
    return (D, f, ease = easeIO) => {
        cancelAnimationFrame(raf);
        if (exporting || stage.classList.contains('instant')) { f(1); return; }
        const st = performance.now();
        const step = n => { const q = Math.min(1, (n - st) / D); f(ease(q)); if (q < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step);
    };
}

/* ---------- CFU furniture ---------- */
function etag(k) { return el('div', 'etag ' + (ENGAGE[k].cls === 'ui-pk' ? 'pk' : 'nv'), ENGAGE[k].html); }
function qrow(html, k) { const r = el('div', 'qrow'), q = el('div', 'q', html); r.append(q, etag(k)); r.q = q; return r; }
function opts(list, vertical) {
    const w = el('div', vertical ? 'optv' : 'opts');
    w.items = list.map((t, i) => { const o = el('div', 'opt rev hide', `<span class="olt">${'ABCD'[i]}</span><span class="otx">${t}</span>`); w.appendChild(o); return o; });
    return w;
}
function answer(items, k) { items.forEach((o, i) => { o.classList.toggle('right', i === k); o.classList.toggle('dimd', i !== k); }); }
function panel(letter, w, h) {
    const p = el('div', 'opan rev hide', `<div class="oph"><span class="olt">${letter}</span><span>Option ${letter}</span><span class="why"></span></div>`);
    p.svg = svgc(w, h, 'sm st'); p.appendChild(p.svg); p.why = p.querySelector('.why'); return p;
}
function revealPanels(ps, k, whys) { ps.forEach((p, i) => { p.classList.toggle('right', i === k); p.classList.toggle('dimd', i !== k); p.why.textContent = whys[i]; p.classList.add('shw'); }); }
function legend(rows, cls) {
    const L = el('div', 'legend' + (cls ? ' ' + cls : ''));
    L.items = rows.map(([n, h]) => { const r = el('div', 'lrow rev hide' + (n ? '' : ' mute'), (n ? `<span class="n">${n}</span>` : '<span class="sqb"></span>') + `<span>${h}</span>`); L.appendChild(r); return r; });
    return L;
}

/* ---------- scenes ---------- */
const scenes = [
{
    title: 'Reading engineering <span>drawings</span>',
    dur: 16000,
    run() {
        const c = el('div', 'center');

        const x0 = 432, y0 = 50, w = 288, h = 168, k = 2.4, rr = 12 * k, by = y0 + h, hx = 576, hy = by - 35 * k;
        const out = P(s, plateD(x0, y0, w, h, rr, rr), 'o dr slow');
        const hole = P(s, circD(hx, hy, 36), 'o dr');
        const cl = cross(s, hx, hy, 50);
        const ds = [dimH(s, x0, x0 + w, by, by, by + 76, '120'), dimV(s, y0, by, x0, x0, x0 - 76, '70'),
            dimH(s, x0, hx, by, by, by + 36, '60'), dimV(s, hy, by, x0, x0, x0 - 36, '35'),
            dimDia(s, hx, hy, 36, -45, 110, '<i class="dia">Ø</i>30'), dimRad(s, x0 + rr, y0 + rr, rr, 225, 46, '2× R12')];
        const chips = el('div', 'chips');
        const ch = ['Dimensions', '<b><i class="dia">Ø</i></b> Diameter', '<b>R</b> Radius', 'Separate views'].map(t => { const e = el('div', 'chip rev hide', t); chips.appendChild(e); return e; });
        c.append(s, chips); content.appendChild(c);
        beatAt(0, 'Before anything can be made, an engineer has to communicate exactly what it should look like.');
        rv(400, out);
        beatAt(4500, 'They use an <b>engineering drawing</b>. It shows every size needed to make the part, using rules everyone agrees on.');
        rv(4900, hole); rv(5400, cl);
        ds.forEach((d, i) => rd(d, 6000 + i * 450));
        beatAt(11000, 'In this lesson, we will learn to read four of these conventions.');
        ch.forEach((e, i) => at(11500 + i * 250, () => show(e)));
    }
},
{
    title: 'Linear <span>dimensions</span>',
    dur: 19500,
    run() {
        const c = el('div', 'center');
        const s = svgc(1152, 400);
        const out = P(s, plateD(401, 70, 350, 200), 'o dr slow');
        const dL = dimH(s, 401, 751, 270, 270, 320, '175');
        const dW = dimV(s, 70, 270, 401, 401, 351, '100');
        c.appendChild(s); content.appendChild(c);
        const u = el('div', 'unit rev hide', '<div class="dlbl">Units</div><div class="um">mm</div><div class="us">Every size is in millimetres, so units are never written.</div>');
        content.appendChild(u);
        beatAt(0, 'Here is a simple rectangular plate. Engineers show every size using a <b>dimension</b>.');
        rv(400, out);
        beatAt(4000, 'Observe as I add the first dimension. It shows the plate has a length of <b>175</b>.');
        rd(dL, 4600);
        beatAt(8500, 'Now the other direction: a width of <b>100</b>. The value is turned so it reads from the right-hand side of the page.');
        rd(dW, 9100);
        beatAt(14000, 'All sizes are in <b>millimetres</b>, so the units are never written. 175 means 175 mm.');
        at(14400, () => show(u));
    }
},
{
    title: 'Anatomy of a <span>dimension</span>',
    dur: 26500,
    run() {
        const c = el('div', 'split');
        const s = svgc(640, 440);
        const out = P(s, plateD(90, 80, 440, 160), 'o dr');
        const d = dimH(s, 90, 530, 240, 240, 330, '175');
        const m = [marker(s, 52, 295, 88, 295, '1', 'pk'), marker(s, 200, 385, 200, 332, '2', 'pk'), marker(s, 572, 378, 524, 334, '3', 'pk'), marker(s, 405, 282, 340, 310, '4', 'pk')];
        const rings = [S('circle', { cx: 90, cy: 243, r: 15 }, 'ring gr'), S('circle', { cx: 90, cy: 337, r: 15 }, 'ring gr')];
        rings.forEach(r => s.appendChild(r));
        const L = legend([['1', '<b>Extension line</b>: shows where a measurement starts and ends.'], ['2', '<b>Dimension line</b>: runs between the extension lines.'],
            ['3', '<b>Arrowhead</b>: marks the exact limit of the measurement.'], ['4', '<b>Value</b>: the size in millimetres, written above the line.'],
            ['', 'A small <b>gap</b> is left between the part and each extension line.']]);
        c.append(s, L); content.appendChild(c);
        beatAt(0, 'Every dimension is built from the same four parts.');
        rv(300, out); rd(d, 900);
        beatAt(3500, 'First, the <b>extension lines</b>. They show where the measurement starts and ends.');
        at(3900, () => { hot(d.e); on(m[0]); show(L.items[0]); });
        beatAt(8000, 'Between them runs the <b>dimension line</b>.');
        at(8400, () => { hot(d.l); on(m[1]); show(L.items[1]); });
        beatAt(12000, 'At each end, an <b>arrowhead</b> marks the exact limit of the measurement.');
        at(12400, () => { hot(d.a); on(m[2]); show(L.items[2]); });
        beatAt(16000, 'Finally, the <b>value</b> sits just above the dimension line. It is the size in millimetres.');
        at(16400, () => { hot(d.t); on(m[3]); show(L.items[3]); });
        beatAt(20500, 'Notice the small <b>gap</b> between the part and the extension line, and how the extension line runs a little past the arrow.');
        at(20900, () => { hot([]); on(rings); show(L.items[4]); });
    }
},
{
    title: 'Check: name the <span>part</span>',
    dur: 12500,
    run() {
        const c = el('div', 'cfu');
        const qr = qrow('Which letter points to an <b>extension line</b>?', 'fv');
        const s = svgc(1152, 400, 'st');
        P(s, plateD(396, 110, 360, 150), 'o');
        const dT = dimH(s, 396, 756, 110, 110, 60, '120');
        const dR = dimV(s, 110, 260, 756, 756, 806, '50');
        const mk = [marker(s, 705, 24, 748, 57, 'A'), marker(s, 500, 24, 552, 44, 'B'), marker(s, 338, 82, 393, 82, 'C'), marker(s, 870, 185, 809, 185, 'D')];
        const lab = [T(s, 730, 31, 'Arrowhead', 'mlab fd2', 'start'), T(s, 475, 31, 'Value', 'mlab fd2', 'end'), T(s, 313, 89, 'Extension line', 'mlab pkt fd2', 'end'), T(s, 895, 192, 'Dimension line', 'mlab fd2', 'start')];
        c.append(qr, s); content.appendChild(c);
        beatAt(0, 'Which letter points to an <b>extension line</b>? Show me with your fingers: one for A, up to four for D.');
        beatAt(6500, 'It is <b>C</b>. The extension line shows where the measurement starts, with a small gap from the part.');

/* ---------- player ---------- */
const dots = $('#dots');
scenes.forEach((_, i) => { const d = el('button'); d.setAttribute('aria-label', 'Scene ' + (i + 1)); d.onclick = () => go(i); dots.appendChild(d); });

const stepLbl = $('#steplbl');
const dur = () => scenes[idx].dur;
const beatEnd = b => (b + 1 < beats.length ? beats[b + 1] : dur());
function label() { stepLbl.textContent = `Step ${beat + 1} of ${beats.length}`; }

function build(i) {
    clearTimers();
    stopInteractive();
    const ni = Math.max(0, Math.min(scenes.length - 1, i));
    if (ni !== idx) { saveInk(); idx = ni; loadInk(); zoomReset(); renderBadges(); }
    events = []; beats = [];
    const sc = scenes[idx];
    content.innerHTML = ''; caption.innerHTML = '';
    titleEl.innerHTML = sc.title;
    counter.innerHTML = `<b>${idx + 1}</b> / ${scenes.length}`;
    [...dots.children].forEach((d, j) => d.classList.toggle('cur', j === idx));
    sc.run();
    beats = [...new Set(beats)].sort((a, b) => a - b);
}

function jumpTo(to) {
    stage.classList.add('instant');
    events.filter(e => !e.done && e.t < to).sort((a, b) => a.t - b.t).forEach(e => { e.done = true; e.fn(); });
    void stage.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
}

function setProgress(from, to) {
    progress.style.transition = 'none';
    progress.style.width = (from / dur() * 100) + '%';
    void progress.offsetWidth;
    progress.style.transition = `width ${Math.max(0, to - from)}ms linear`;
    progress.style.width = (to / dur() * 100) + '%';
}

function play(from, to, onEnd) {
    clearTimers();
    segFrom = from; segTo = to; segStart = performance.now();
    events.filter(e => !e.done && e.t >= from && e.t < to)
        .forEach(e => timers.push(setTimeout(() => { e.done = true; e.fn(); }, e.t - from)));
    beats.forEach((bt, k) => { if (bt > from && bt < to) timers.push(setTimeout(() => { beat = k; label(); }, bt - from)); });
    if (onEnd) timers.push(setTimeout(onEnd, to - from));
    setProgress(from, to);
}

function now() { return Math.min(segTo, segFrom + performance.now() - segStart); }

function startBeat(b) {
    beat = b; label();
    jumpTo(beats[b]);
    if (autoplay) play(beats[b], dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    else play(beats[b], beatEnd(b));
}

function go(i, b = 0) {
    build(i);
    startBeat(b === 'last' ? beats.length - 1 : b);
}

function next() {
    if (autoplay) { if (idx < scenes.length - 1) go(idx + 1); return; }
    clearTimers();
    if (beat < beats.length - 1) { jumpTo(beatEnd(beat)); startBeat(beat + 1); }
    else if (idx < scenes.length - 1) go(idx + 1);
    else { jumpTo(dur()); setProgress(dur(), dur()); }
}

function back() {
    if (autoplay) { go(idx - 1); return; }
    if (beat > 0) go(idx, beat - 1);
    else if (idx > 0) go(idx - 1, 'last');
    else go(0);
}

function toggleAuto() {
    autoplay = !autoplay;
    autoBtn.classList.toggle('on', autoplay); autoBtn.setAttribute('aria-pressed', autoplay);
    const cur = now();
    clearTimers();
    if (autoplay) {
        play(cur, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    } else {
        let b = 0; beats.forEach((bt, k) => { if (bt <= cur) b = k; });
        beat = b; label();
        jumpTo(beatEnd(b));
        setProgress(beatEnd(b), beatEnd(b));
    }
}

const autoBtn = $('#auto');
$('#next').onclick = next;
$('#back').onclick = back;
$('#replay').onclick = () => { zoomReset(); go(idx); };
autoBtn.onclick = toggleAuto;
const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);
document.addEventListener('keydown', e => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (wbOpen) {
        if (e.key === 'ArrowRight') wbGo(wbPage + 1);
        if (e.key === 'ArrowLeft') wbGo(wbPage - 1);
        if (e.key === 'n' || e.key === 'N') wbNew();
        if (e.key === ' ') e.preventDefault();
        return;
    }
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') back();
    if (e.key === 'r' || e.key === 'R') { zoomReset(); go(idx); }
    if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

        const w = el('div', 'ui-thw'); if (thumbs[i]) w.appendChild(thumbs[i].cloneNode(true));
        c.append(w, el('div', 'ui-lb', `<span class="ui-n">${i + 1}</span><span class="ui-t">${sc.title}</span>`));
        c.onclick = () => { closeModal(); if (i !== idx) go(i); };
        g.appendChild(c);
    });
}

const SHORTCUTS = [
    ['Slides', [['&rarr;', 'Next'], ['&larr;', 'Previous'], ['R', 'Replay scene'], ['Space', 'Autoplay'], ['G', 'Slide overview']]],
    ['Draw', [['P', 'Pen'], ['Y', 'Highlighter'], ['E', 'Eraser'], ['B', 'Text box'], ['C', 'Clear ink'], ['Ctrl|Z', 'Undo'], ['Ctrl|Shift|Z', 'Redo']]],
    ['Focus', [['Z', 'Zoom (scroll to adjust)'], ['L', 'Lock zoom'], ['H', 'Spotlight (scroll to resize)'], ['K', 'Blackout']]],
    ['Engage', [['M', 'Engagement methods'], ['1|5', 'Choose a method'], ['T', 'Timer']]],
    ['Whiteboard', [['W', 'Open or close'], ['&larr;|&rarr;', 'Change page'], ['N', 'New page']]],
    ['View', [['F', 'Fullscreen'], ['U', 'Hide or show UI'], ['S', 'Subtitles'], ['?', 'Shortcuts'], ['Esc', 'Close or stop tool']]]
];
$('#kgrid').innerHTML = SHORTCUTS.map(([h, rows]) => `<div class="ui-kgrp"><h3>${h}</h3>${rows.map(([k, l]) => {
    const keys = k === '1|5' ? '<kbd>1</kbd>to<kbd>5</kbd>' : k.split('|').map(x => `<kbd>${x}</kbd>`).join(k.includes('Ctrl') ? '+' : '');
    return `<div class="ui-krow"><span class="ui-ks">${keys}</span><span>${l}</span></div>`;
}).join('')}</div>`).join('');

/* ---------- export PDF ---------- */
const printBox = $('#print');
function snapStage(boardOnly) {
    stage.querySelectorAll('input').forEach(n => n.setAttribute('value', n.value));
    const page = stage.cloneNode(true), imgs = [];
    page.removeAttribute('id'); page.removeAttribute('style'); page.classList.remove('instant');
    page.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    page.querySelectorAll('.ui-spot, canvas.hllive').forEach(n => n.remove());
    [['canvas.ink', ink, inkMarked, 'ink'], ['canvas.hlmain', hlc, hlMarked, 'ui-hlc']].forEach(([sel, src, marked, cls]) => {
        const cv = page.querySelector(sel); if (!cv) return;
        if (marked) { const img = new Image(); img.className = cls; img.alt = ''; img.src = src.toDataURL(); cv.replaceWith(img); imgs.push(img); }
        else cv.remove();
    });
    if (boardOnly) page.querySelectorAll('.top, .content, .caption, .progress').forEach(n => n.remove());
    return { page, imgs };
}
function runScene(i) {
    build(i);
    events.slice().sort((a, b) => a.t - b.t).forEach(e => { if (!e.done) { e.done = true; e.fn(); } });
    progress.style.transition = 'none'; progress.style.width = '100%';
}
function buildThumbs() {
    exporting = true;
    for (let i = 0; i < scenes.length; i++) {
        runScene(i);
        const { page } = snapStage(false);
        page.querySelectorAll('canvas, img.ink, img.ui-hlc, .ui-blayer').forEach(n => n.remove());
        thumbs[i] = page;
    }
    exporting = false;
}
async function exportPDF() {
    if (document.activeElement) document.activeElement.blur();
    zoomReset();
    printBox.innerHTML = '';
    const imgs = [];
    if (wbOpen) {
        const keep = wbPage;
        for (let p = 0; p < wbPages; p++) {
            wbPage = p; loadSurface(); syncWB();
            const r = snapStage(true); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        wbPage = keep; loadSurface(); syncWB();
    } else {
        const keepIdx = idx, keepBeat = beat;
        exporting = true;
        for (let i = 0; i < scenes.length; i++) {
            runScene(i);
            const r = snapStage(false); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        exporting = false;
        go(keepIdx, keepBeat);
    }
    await Promise.all(imgs.map(im => im.decode().catch(() => {})));
    window.print();
}
$('#pdf').onclick = exportPDF;
$('#wbpdf').onclick = () => { $('#wbpdf').blur(); exportPDF(); };
window.addEventListener('afterprint', () => { printBox.innerHTML = ''; });

document.addEventListener('keydown', e => {
    if (isTyping(e)) return;
    if (e.ctrlKey || e.metaKey) {
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); e.shiftKey ? redoInk() : undoInk(); }
        else if (k === 'y') { e.preventDefault(); redoInk(); }
        return;
    }
    if (e.altKey) return;
    if (e.key === 'p' || e.key === 'P') setTool(tool === 'pen' ? null : 'pen');
    if (e.key === 'e' || e.key === 'E') setTool(tool === 'eraser' ? null : 'eraser');
    if (e.key === 'c' || e.key === 'C') clearInk();
    if (e.key === 's' || e.key === 'S') toggleSubs();
    if (e.key === 't' || e.key === 'T') ftShow(ftEl.hidden);
    if (e.key === 'u' || e.key === 'U') setUI(!document.body.classList.contains('noui'));
    if (e.key === 'z' || e.key === 'Z') setZoom(!Z.on);
    if (e.key === 'l' || e.key === 'L') setLock(!Z.locked);
    if (e.key === 'h' || e.key === 'H') setSpot(!SP.on);
    if (e.key === 'f' || e.key === 'F') toggleFS();
    if (e.key === 'm' || e.key === 'M') toggleMenu(engMenu);
    if (e.key === 'b' || e.key === 'B') { e.preventDefault(); closeMenus(); addText(true); }
    if (e.key === 'y' || e.key === 'Y') setTool(tool === 'hl' ? null : 'hl');
    if (e.key === 'w' || e.key === 'W') toggleWB();
    if (e.key === 'k' || e.key === 'K') openModal('blk');
    if ((e.key === 'g' || e.key === 'G') && !wbOpen) openModal('ovw');
    if (e.key === '?' || e.key === '/') { e.preventDefault(); openModal('keys'); }
    if (/^[1-5]$/.test(e.key) && engMenu.classList.contains('ui-open')) { addBadge(ENG_KEYS[+e.key - 1]); closeMenus(); }
    if (e.key === 'Escape') closeMenus();
    if (e.key === 'Escape') setTool(null);
});

const controlsEl = document.querySelector('.controls');
function fit() {
    const st = $('#stage'), noui = document.body.classList.contains('noui');
    const vw = window.innerWidth - (noui ? 0 : 40), vh = window.innerHeight - (noui ? 0 : controlsEl.offsetHeight + 20);
    const k = Math.min(vw / 1280, vh / 720);
    scaleK = k;
    st.style.transform = `scale(${k})`;
    st.style.margin = `${(720 * k - 720) / 2}px ${(1280 * k - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); buildThumbs(); go(0); });
</script>
