<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Drawings: Checking for Understanding</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%231b1f45"/><path d="M15 31 L27 43 L49 19" fill="none" stroke="%23ea008a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="52" width="40" height="5" rx="2.5" fill="%23fff" opacity=".25"/><rect x="12" y="52" width="26" height="5" rx="2.5" fill="%23fff"/></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    svg [tabindex]:focus-visible { outline: none; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 40px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .sctag { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); border-radius: 6px; padding: 6px 12px 5px; line-height: 1; }
    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .prompt b { color: var(--pink); font-weight: 800; }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 30px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* drawing conventions */
    svg { overflow: visible; display: block; }
    .pt { fill: #fff; stroke: var(--navy); stroke-width: 3; }
    .pt.nf { fill: none; }
    .cl { fill: none; stroke: var(--navy); stroke-width: 1.5; stroke-dasharray: 14 4 3 4; }
    .dl { stroke: var(--pink); stroke-width: 2; fill: none; }
    .dval { font-family: var(--cond); font-size: 22px; font-weight: 800; fill: var(--pink); }
    .dval.sm { font-size: 17px; }
    .dvaln { font-family: var(--cond); font-size: 22px; font-weight: 800; fill: var(--navy); }
    .proj { stroke: #b5b9c6; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .vlbl { font-family: var(--cond); font-size: 16px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; fill: var(--navy); }
    .rtick { stroke: var(--navy); stroke-width: 1.1; }
    .rtick.c { stroke-width: 1.8; }
    .rnum { font-family: var(--cond); font-size: 14px; font-weight: 800; fill: var(--navy); }
    .rnum.sm { font-size: 12px; }
    .oname { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .spd { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; fill: var(--mid-grey); }
    .leg { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: var(--mid-grey); }
    .hn { font-family: var(--cond); font-size: 17px; font-weight: 900; fill: var(--navy); }
    .dsym { display: inline-block; position: relative; width: .66em; height: .66em; border: .1em solid currentColor; border-radius: 50%; box-sizing: border-box; margin: 0 .06em 0 .03em; vertical-align: 0; }
    .dsym::after { content: ''; position: absolute; left: 50%; top: 50%; width: .1em; height: .92em; background: currentColor; border-radius: .04em; transform: translate(-50%, -50%) rotate(45deg); }
    .reveal { animation: fadeIn .55s var(--ease) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sq, .rl, .pm { cursor: grab; touch-action: none; }
    .sq.drag, .rl.drag, .pm.drag { cursor: grabbing; }
    .sq:focus-visible .stk, .rl:focus-visible .rbody { stroke: var(--pink); stroke-width: 3; }
    .pm .pr { fill: rgba(255,255,255,.82); stroke: var(--navy); stroke-width: 2.5; transition: stroke .2s; }
    .pm:focus-visible .pr { stroke: var(--pink); }
    .pm.right { cursor: default; }
    .pm.right .pr { stroke: var(--pink); stroke-width: 4; }
    .pm.wrong .pr { stroke-dasharray: 5 4; }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; }
    .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 16px 4px 12px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .2s; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 23px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s; }
    .pcard .cap { font-size: 22px; font-weight: 700; line-height: 1.2; text-align: center; }
    .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .pcard.sel { background: var(--tint); }
    .pcard.sel .l { background: var(--pink); }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 5px rgba(234,0,138,.18); opacity: 1; }
    .pcard.right .l { background: var(--pink); }
    .pcard.wrong { border-style: dashed; opacity: .45; animation: shake .4s; cursor: default; }
    .pcard:disabled { cursor: default; }

    /* scenes */
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { transition: none; cursor: grabbing; z-index: 30; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; cursor: default; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }
    .pool { background: var(--blank); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; transition: background-color .2s; }
    .pool.hover { background: #e3e7ee; }

    /* label a drawing */
    .bwrap { position: relative; border: 3px solid var(--navy); border-radius: 8px; flex-shrink: 0; }
    .bwrap > svg { position: absolute; left: 0; top: 0; }
    .slot { position: absolute; width: 200px; height: 50px; border: 3px dashed #c3c6d0; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; }
    .slot.hover, .slot.armed:hover { border-color: var(--pink); background: #fdf0f7; }
    .slot.armed { border-color: #e7a3c9; cursor: pointer; }
    .slot.filled { border-color: transparent; background: none; }
    .slot.wrong { animation: shake .4s; }
    .slot .tile { box-shadow: none; padding: 4px 12px; font-size: 22px; }
    .bside { width: 320px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .bside .pool { flex: 1; flex-direction: column; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 6px; padding: 10px; }
    .bside .pool.wrapr { flex-direction: row; flex-wrap: wrap; align-content: center; gap: 14px; }
    .bside .tile { font-size: 21px; padding: 4px 12px; }

    /* fill the gaps */
    .cloze { flex: 1; display: flex; flex-direction: column; gap: 6px; align-self: stretch; justify-content: center; }
    .cline { display: flex; align-items: center; flex-wrap: wrap; font-size: 26px; font-weight: 600; min-height: 66px; border-bottom: 2px solid var(--light-grey); }
    .blank { display: inline-flex; align-items: center; justify-content: center; min-width: 100px; height: 50px; margin: 0 10px; border: 3px dashed #c3c6d0; border-radius: 8px; transition: border-color .2s, background-color .2s; }
    .blank.hover, .blank.armed:hover { border-color: var(--pink); background: #fdf0f7; }
    .blank.armed { border-color: #e7a3c9; cursor: pointer; }
    .blank.filled { border-color: transparent; }
    .blank.wrong { animation: shake .4s; }
    .blank .tile { box-shadow: none; padding: 4px 14px; }
    .tray { margin-top: 14px; min-height: 78px; }

    /* typed answers */
    .nin { width: 110px; font-family: inherit; font-size: 28px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 4px 8px; text-align: center; outline: none;
        -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s, color .2s; }
    .nin:focus { border-color: var(--pink); }
    .nin:focus-visible { outline: none; }
    .nin.right { background: var(--pink); border-color: var(--pink); color: #fff; }
    .nin.wrong { border-style: dashed; animation: shake .4s; }
    .qrows { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
    .qrow { display: grid; grid-template-columns: 34px 1fr 96px 36px; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; line-height: 1.2; }
    .qrow .qn { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .qrow .nin { width: 96px; font-size: 25px; padding: 3px 4px; }
    .u { font-family: var(--cond); font-size: 20px; font-weight: 800; color: var(--mid-grey); text-transform: uppercase; letter-spacing: .06em; }

    /* side panels and tools */
    .side { width: 270px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; align-self: stretch; justify-content: center; }
    .card { border: 3px solid var(--navy); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .tools { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .tool { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 9px 10px 8px; cursor: pointer; transition: opacity .2s, background-color .2s; }
    .tool.pk { background: var(--pink); border-color: var(--pink); color: #fff; }
    .tool:hover:not(:disabled) { background: #f6f7fb; }
    .tool.pk:hover:not(:disabled) { background: #d1007b; }
    .tool:disabled { opacity: .35; cursor: default; }
    .tool svg { width: 20px; height: 20px; flex-shrink: 0; }
    .note { font-size: 18px; font-weight: 600; color: var(--mid-grey); line-height: 1.3; }
    .note b { color: var(--navy); font-weight: 800; }
    .mrow { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; }

    /* candidate spots */
    .bd { position: relative; }
    .cand { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 22px; font-weight: 900;
        border: 3px solid #fff; box-shadow: 0 0 0 2px var(--navy); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color .2s, box-shadow .2s, opacity .2s; }
    .cand:hover:not(:disabled) { background: #2b3166; }
    .cand.sel { background: var(--pink); box-shadow: 0 0 0 2px var(--pink), 0 0 0 8px rgba(234,0,138,.22); }
    .cand.right, .cand.right:hover { background: var(--pink); box-shadow: 0 0 0 2px var(--pink); }
    .cand.wrong { opacity: .3; animation: shake .4s; }
    .cand:disabled { cursor: default; }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 22px 60px 26px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .scorecard .big { font-family: var(--cond); font-size: 96px; font-weight: 900; color: var(--pink); line-height: 1; margin-top: 8px; }
    .scorecard .dlbl { margin-top: 8px; }
    .scorecard .sub { margin-top: 22px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }

    /* buckles */
    .hright { display: flex; align-items: flex-end; gap: 28px; }
    .bcount { display: flex; align-items: center; gap: 10px; }
    .counter-icon { width: 34px; height: 34px; display: block; }
    .bcount .num { font-family: var(--cond); font-size: 34px; font-weight: 900; line-height: 1; }
    .bcount .lbl { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }
    .done-buckle { width: 90px; height: 90px; }
    .award { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 30;
        background: #fff; border: 3px solid var(--pink); border-radius: 12px; padding: 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        box-shadow: 0 20px 50px rgba(27,31,69,.25); transition: opacity .3s, transform .35s var(--ease); }
    .award.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .award.hide { opacity: 0; transform: translate(-50%, -60%) scale(.95); }
    .award-img { width: 140px; height: auto; }
    .award-text { font-family: var(--cond); font-size: 40px; font-weight: 900; color: var(--pink); text-transform: uppercase; letter-spacing: .04em; }
    .confetti-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 29; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Checking <span>drawings</span></h1>
        <div class="hright">
            <div class="counter" id="counter"></div>
            <div class="bcount" title="Buckles earned">
                <img src="buckle.svg" alt="" class="counter-icon" onerror="this.style.visibility='hidden'">
                <div class="num" id="buckleCount">0</div>
                <div class="lbl">Buckles</div>
            </div>
        </div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
</div>

<div class="award" id="award" role="status" aria-live="polite">
    <img src="penguin-with-buckle.svg" alt="" class="award-img" onerror="this.style.display='none'">
    <div class="award-text" id="awardText">+1 Buckle!</div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', DT = '#b5b9c6', LT = '#f0f3f6', WOOD = '#f5f0e6', GRAIN = '#e4dbc8', STEEL = '#e4e8ef';
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; symFix(cap); }
/* the diameter symbol: drawn as a circle with a slash so it never looks like the letter O */
const DSYM = '\u2300', SVGNS = 'http://www.w3.org/2000/svg';
function symFix(root) {
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.includes(DSYM) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP });
    const nodes = []; while (tw.nextNode()) nodes.push(tw.currentNode);
    const texts = new Set();
    nodes.forEach(n => {
        const inSvg = n.parentNode.namespaceURI === SVGNS, frag = document.createDocumentFragment();
        n.nodeValue.split(DSYM).forEach((part, i) => {
            if (i) {
                if (inSvg) { const t = document.createElementNS(SVGNS, 'tspan'); t.setAttribute('class', 'dsym'); t.setAttribute('fill-opacity', '0'); t.textContent = 'O'; frag.appendChild(t); }
                else { const sp = document.createElement('span'); sp.className = 'dsym'; sp.setAttribute('role', 'img'); sp.setAttribute('aria-label', 'diameter'); frag.appendChild(sp); }
            }
            if (part) frag.appendChild(document.createTextNode(part));
        });
        if (inSvg) texts.add(n.parentNode.closest('text'));
        n.parentNode.replaceChild(frag, n);
    });
    texts.forEach(text => {
        if (!text) return;
        let idx = 0, g = '';
        const w = document.createTreeWalker(text, NodeFilter.SHOW_TEXT);
        while (w.nextNode()) {
            const n = w.currentNode, sym = n.parentNode.classList && n.parentNode.classList.contains('dsym');
            if (sym) {
                try {
                    const b = text.getExtentOfChar(idx), base = text.getStartPositionOfChar(idx).y, cs = getComputedStyle(n.parentNode), fs = parseFloat(cs.fontSize), col = cs.fill;
                    const ch = fs * .7, r = Math.min(b.width * .5, ch * .5) * .9, cx = b.x + b.width / 2, cy = base - ch / 2, sw = fs * .095, k = r * 1.3 * .7071;
                    g += `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="none" stroke="${col}" stroke-width="${f1(sw)}"/><line x1="${f1(cx - k)}" y1="${f1(cy + k)}" x2="${f1(cx + k)}" y2="${f1(cy - k)}" stroke="${col}" stroke-width="${f1(sw)}" stroke-linecap="round"/>`;

    /* slide a steel rule and read a length */

        body.append(sc, side);

        const locked = new Set(), bad = new Set();

            const E = f1(xOf(mm));

        function drawMarks(anim) {

            while (marks.length > q.need) { const i = marks.findIndex(m => !locked.has(m)); if (i < 0) break; bad.delete(marks[i]); marks.splice(i, 1); }

            start: p => { if (mode !== 'check') return false; off = p.x - xOf(mm); sq.classList.add('drag'); },

            if (mode !== 'check') return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); mm = clamp(mm + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 10 : 1), 0, LEN); upd(); }
            else if (e.key === 'Enter' || e.key === ' ' || e.key.toLowerCase() === 'm') { e.preventDefault(); mark(); }
        });

        const ctx = { svg, res: svg.querySelector('.res'), BX, BY, K, BH, BL, hid };
        return {
            instr: 'Drag the try square (or use the arrow keys), then press <b>Mark line</b>. Press <b>Check</b> when you are done.',
            ready: () => marks.length === q.need,
            check() {
                let hint = null, nb = 0;
                bad.clear();
                marks.forEach(m => { if (q.targets.includes(m)) locked.add(m); else { bad.add(m); nb++; if (!hint) hint = q.hintFor(m); } });
                drawMarks(); count();
                return nb ? { ok: false, hint: (nb > 1 ? `${nb} lines are in the wrong place. ` : '') + hint } : { ok: true };
            },
            async done() {
                mkb.disabled = true; erb.disabled = true;
                await play(300, k => { sq.setAttribute('opacity', 1 - k); lp.setAttribute('opacity', 1 - k); });
                sq.style.display = 'none'; lp.style.display = 'none';
                await q.done(ctx);

    },

    /* drag punch marks to hole centres */
    punch(q, body) {
        body.style.gap = '20px';
        const W = 880, H = 370, K = 5, BX = 96, BY = 54, LEN = q.L, WM = q.Wmm, BL = LEN * K, BH = WM * K;
        const TRAY = [{ x: 790, y: 160 }, { x: 790, y: 250 }];
        const sc = el('div', 'scene');
        sc.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="856" height="${Math.round(H * 856 / W)}">
            <rect x="${BX}" y="${BY}" width="${BL}" height="${BH}" fill="${WOOD}" stroke="${NV}" stroke-width="3"/>${grainSVG(BX, BY, BL, BH, 46)}
            ${ruleSVG({ x0: BX, y0: BY, mm: LEN, K, side: -1, w: 30 })}${ruleSVG({ axis: 'y', x0: BX, y0: BY, mm: WM, K, side: -1, w: 34 })}
            <rect x="735" y="110" width="110" height="200" rx="10" fill="${LT}" stroke="${GR}" stroke-width="3" stroke-dasharray="7 6"/>
            <text class="spd" x="790" y="98" text-anchor="middle" style="font-size:18px">Punch marks</text>
            <g class="gd"></g><g class="res"></g><g class="pms"></g></svg>`;
        const side = el('div', 'side');
        side.innerHTML = `<div class="card"><div class="dlbl">The drawing</div>${q.drawing}<div class="note">${q.note}</div></div>`;
        body.append(sc, side);
        const svg = sc.querySelector('svg'), pms = svg.querySelector('.pms'), gd = svg.querySelector('.gd'), res = svg.querySelector('.res');
        const ms = q.targets.map((_, i) => {
            pms.insertAdjacentHTML('beforeend', `<g class="pm" tabindex="0" role="button" aria-label="Punch mark ${i + 1}"><circle r="26" fill="transparent"/><circle class="pr" r="15"/><line x1="-22" x2="22" y1="0" y2="0" stroke="${NV}" stroke-width="1.5"/><line x1="0" x2="0" y1="-22" y2="22" stroke="${NV}" stroke-width="1.5"/><circle r="2.6" fill="${NV}"/></g>`);
            return { i, el: pms.lastElementChild, x: TRAY[i].x, y: TRAY[i].y, on: false, ok: false, mx: null, my: null, t: -1 };
        });
        const setPos = m => m.el.setAttribute('transform', `translate(${f1(m.x)} ${f1(m.y)})`);
        const inside = (x, y) => x >= BX - 12 && x <= BX + BL + 12 && y >= BY - 12 && y <= BY + BH + 12;
        const snapTo = (m, x, y) => { m.mx = clamp(Math.round((x - BX) / K), 0, LEN); m.my = clamp(Math.round((y - BY) / K), 0, WM); m.x = BX + m.mx * K; m.y = BY + m.my * K; m.on = true; };
        const guides = () => {
            gd.innerHTML = ms.filter(m => m.on).map(m => `<line x1="${m.x}" x2="${m.x}" y1="${m.y}" y2="${BY}" stroke="${PK}" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="${m.x}" x2="${BX}" y1="${m.y}" y2="${m.y}" stroke="${PK}" stroke-width="1.5" stroke-dasharray="4 4"/>${ah(m.x, BY, -Math.PI / 2, PK, 10, 4.5)}${ah(BX, m.y, Math.PI, PK, 10, 4.5)}`).join('');
        };
        const home = m => {
            const sx = m.x, sy = m.y, T = TRAY[m.i]; m.on = false; m.mx = m.my = null; guides();
            play(300, k => { const e = easeOut(k); m.x = sx + (T.x - sx) * e; m.y = sy + (T.y - sy) * e; setPos(m); });
        };
        ms.forEach(m => {
            setPos(m);
            let ox = 0, oy = 0;
            dragOn(m.el, svg, {
                start: p => { if (mode !== 'check' || m.ok) return false; ox = p.x - m.x; oy = p.y - m.y; m.el.classList.add('drag'); m.el.classList.remove('wrong'); },
                move: p => { const x = p.x - ox, y = p.y - oy; if (inside(x, y)) snapTo(m, x, y); else { m.x = x; m.y = y; m.on = false; } setPos(m); guides(); refresh(); },
                end: () => { m.el.classList.remove('drag'); if (!m.on) home(m); refresh(); }
            });
            m.el.addEventListener('keydown', e => {
                if (mode !== 'check' || m.ok) return;
                const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
                if (!d) return;
                e.preventDefault();
                const st = (e.shiftKey ? 10 : 1) * K;
                if (!m.on) snapTo(m, BX + BL / 2, BY + BH / 2); else snapTo(m, m.x + d[0] * st, m.y + d[1] * st);
                m.el.classList.remove('wrong'); setPos(m); guides(); refresh();
            });
        });
        return {
            instr: 'Drag both punch marks onto the board (or use the arrow keys), then press <b>Check</b>.',
            ready: () => ms.every(m => m.on),
            check() {
                const used = new Set(ms.filter(m => m.ok).map(m => m.t));
                let hint = null, nb = 0;
                ms.filter(m => !m.ok).forEach(m => {
                    m.el.classList.remove('wrong');
                    const t = q.targets.findIndex((tg, j) => !used.has(j) && tg[0] === m.mx && tg[1] === m.my);
                    if (t >= 0) { used.add(t); m.ok = true; m.t = t; m.el.classList.add('right'); }
                    else {
                        nb++; void m.el.getBBox(); m.el.classList.add('wrong');
                        if (!hint) hint = q.targets.some(tg => tg[0] === m.mx && tg[1] === m.my) ? 'Both punch marks are on the same hole. Move one to the other hole.' : q.hintFor(m.mx, m.my);
                    }
                });
                return nb ? { ok: false, hint: (nb > 1 ? 'Both punch marks need moving. ' : '') + hint } : { ok: true };
            },
            async done() {
                gd.innerHTML = '';
                for (const t of q.targets) await drill(res, BX + t[0] * K, BY + t[1] * K, 'Pilot hole');
            }
        };
    }
};

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let sl = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (sl) sl.classList.remove('sel'); sl = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (sl && !z.locked) put(sl, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(text) {
        const t = el('span', 'tile', esc(text)); t.dataset.k = text;
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right') || mode !== 'check') return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool) { if (sl && sl !== t && !z.locked) { put(sl, z); return; } put(t, pool); return; }
            if (sl === t) { deselect(); return; }
            deselect(); sl = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || mode !== 'check' || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
window.addEventListener('storage', e => { if (e.key === 'buckles-shared') refreshCount(); });
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    fit(); refreshCount();
    const pos = Buckles.getPos();
    if (pos >= TOTAL) finish(); else { qi = Math.max(0, pos); render(); }
});
</script>
